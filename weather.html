<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Weather App">
    <title>Weather | Joel Figov</title>
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/scrolling-nav.css" rel="stylesheet">
    <link href="css/weather.css" rel="stylesheet">
  </head>

  <body id="page-top">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
      <div class="container">
        <a class="navbar-brand" href="index.html">About Me</a>
        <span class="navbar-text text-light ml-2">| Weather</span>
      </div>
    </nav>

    <header class="bg-primary text-white">
      <div class="container text-center">
        <h1>Weather App</h1>
        <p class="lead">Search for current weather anywhere in the world</p>
      </div>
    </header>

    <section id="weather">
      <div class="container">

        <!-- Search -->
        <div class="row justify-content-center mb-4">
          <div class="col-lg-6">
            <div class="input-group mt-4">
              <input type="text" id="cityInput" class="form-control form-control-lg"
                placeholder="Enter city name..." aria-label="City name">
              <div class="input-group-append">
                <button class="btn btn-primary btn-lg" id="searchBtn" type="button">Search</button>
              </div>
            </div>
            <div id="errorMsg" class="alert alert-danger mt-2 d-none" role="alert"></div>
          </div>
        </div>

        <!-- Loading -->
        <div id="loadingSpinner" class="d-none text-center py-5">
          <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="sr-only">Loading...</span>
          </div>
          <p class="mt-3 text-muted">Fetching weather data...</p>
        </div>

        <!-- Current Weather -->
        <div id="currentWeather" class="d-none">
          <div class="row justify-content-center mb-4">
            <div class="col-lg-8">
              <div class="card shadow weather-card">
                <div class="card-body text-center py-4">
                  <h2 id="locationName" class="card-title mb-1"></h2>
                  <p id="localTime" class="text-muted small mb-2"></p>
                  <div class="weather-icon" id="currentIcon"></div>
                  <p class="weather-description" id="currentDesc"></p>
                  <div class="row align-items-center">
                    <div class="col-sm-6 mb-3 mb-sm-0">
                      <div class="temp-display">
                        <span id="tempC"></span>°C
                      </div>
                      <div class="temp-alt"><span id="tempF"></span>°F</div>
                      <p class="text-muted mt-1 mb-0">Feels like <span id="feelsLike"></span>°C</p>
                    </div>
                    <div class="col-sm-6">
                      <div class="stats-grid">
                        <div class="stat-item">
                          <span class="stat-icon">💧</span>
                          <span class="stat-label">Humidity</span>
                          <span class="stat-value" id="humidity"></span><span class="stat-unit">%</span>
                        </div>
                        <div class="stat-item">
                          <span class="stat-icon">💨</span>
                          <span class="stat-label">Wind</span>
                          <span class="stat-value" id="windSpeed"></span><span class="stat-unit"> km/h</span>
                        </div>
                        <div class="stat-item">
                          <span class="stat-icon">🌧️</span>
                          <span class="stat-label">Precip.</span>
                          <span class="stat-value" id="precipitation"></span><span class="stat-unit"> mm</span>
                        </div>
                        <div class="stat-item">
                          <span class="stat-icon">🔆</span>
                          <span class="stat-label">UV Index</span>
                          <span class="stat-value" id="uvIndex"></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 7-Day Forecast -->
          <div class="row justify-content-center mb-5">
            <div class="col-lg-10">
              <h4 class="text-center mb-3">7-Day Forecast</h4>
              <div id="forecast" class="row justify-content-center"></div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <footer class="py-5 bg-dark">
      <div class="container">
        <p class="m-0 text-center text-white">
          Copyright &copy; Joel Figov &mdash;
          Weather data by <a href="https://open-meteo.com/" class="text-light" target="_blank" rel="noopener">Open-Meteo</a>
        </p>
      </div>
    </footer>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/weather.js"></script>

  </body>

</html>
